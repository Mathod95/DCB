# Contenu de la page /regles. À modifier puis commiter, comme les cartes.
# Après une modification : bouton « Recharger les fichiers » de la galerie (ou relancer le serveur).
#
# Mise en forme dans les textes :
#   ***terme***      gras italique (termes de statut : to-do, pending, done…)
#   $25.000,00       les montants en dollars sont mis en évidence automatiquement

title = "Atteignez le million."
context = [
  "Vous êtes DevOps ! Avec une petite équipe de passionnés, vous avez créé une application qui peut rapporter des millions ! Vous finissez par vous faire repérer et intégrez un incubateur de startups qui croit en votre potentiel et investit $25.000,00. À vous d'en faire bon usage pour faire de votre startup une grande entreprise, et essayer de devenir riche !",
  "Ah ! J'oubliais: vous n'êtes pas les seuls à avoir obtenu ce premier investissement. En face de vous, une autre équipe va tout faire pour atteindre le million avant vous :)",
]

# Chiffres clés, en cartes sous le texte d'introduction
facts = [
  { label = "Budget de départ", value = "$25.000,00" },
  { label = "Objectif", value = "$1.000.000,00" },
  { label = "Main de départ", value = "10 cartes" },
  { label = "Cycle de jeu", value = "Weekly Sprint" },
  { label = "Mode de jeu", value = "One to One" },
]

[start]
title = "Une startup, le strict minimum"
text = "Vous démarrez la partie avec un strict minimum de ressources humaines et techniques !"
# `note` : annotation affichée en commentaire sous le texte
note = "Vous pourriez même dire que vous étiez là depuis le début et que vous avez vous-même nommé la première application de l'entreprise ;)"

[[start.groups]]
title = "L'équipe"
items = [
  { label = "DevOps", type = "hr" },
  { label = "CEO", type = "hr" },
  { label = "CSM", type = "hr" },
  { label = "Marketing", type = "hr" },
]

[[start.groups]]
title = "L'infrastructure"
items = [
  { label = "Un cluster Kubernetes", type = "resource" },
  # `typing` : noms tapés puis effacés l'un après l'autre
  { label = "MaSuperApp", type = "app", typing = ["MaSuperApp", "xX_Application_Xx", "app-finale-v2-OK", "TodoList 3000", "Projet Phoenix", "prod-do-not-touch"] },
]

[victory]
title = "Une seule façon de gagner"
text = "C'est très simple: soyez le premier à atteindre $1.000.000,00."
note = "Et si vous n'y arrivez pas, évitez au moins la banqueroute ;)"
start_amount = 25000
goal_amount = 1000000

# Les types de cartes, dans l'ordre d'affichage. Chacun montre une carte de la collection
# tirée au hasard à chaque chargement de la page.
[types]
title = "Il existe 5 types de cartes"

[[types.items]]
type = "hr"
name = "RESSOURCES HUMAINES"
text = "Elles vous permettent de recruter de nouveaux collègues pour augmenter votre nombre de déploiements journaliers."

[[types.items]]
type = "incident"
name = "INCIDENTS"
text = "Elles vous permettent d'agir sur l'infrastructure de votre adversaire. Ces cartes ont des effets négatifs sur son infrastructure, immédiats ou dans la durée. Elles peuvent être contrées par des cartes RESOURCES."

[[types.items]]
type = "event"
name = "EVENTS"
text = "La vie est faite de surprises ! Des événements aléatoires, aussi bien positifs que négatifs, se déclenchent tout au long de la partie (1 à 3 événements par semaine)."

[[types.items]]
type = "app"
name = "APPS"
text = "Dans Age of Empires, vous construisez des bâtiments pour créer de nouvelles unités et les faire évoluer. C'est un peu le même principe ici avec les cartes APPS: elles vous permettent de déployer des applications Platform et Métier, qui augmentent vos revenus journaliers ou renforcent les défenses de votre infrastructure."

[[types.items]]
type = "resource"
name = "RESOURCES"
text = "Encore une fois, voyez les RESOURCES comme votre armée: elle vous aide à garder le cap sur votre budget."

# Partie « Anatomie d'une carte » (avant les types de cartes) : une carte de la collection tirée
# au hasard, annotée zone par zone. `key` place la zone sur le schéma (name, type, stroke, art,
# description, effect, deploy, daily, flavor) ; `field` est le champ du fichier de la carte.
[anatomy]
title = "Anatomie d'une carte"
text = "Toutes les cartes partagent le même squelette: neuf zones, toujours à la même place. Survolez une étiquette pour repérer sa zone sur la carte, ou passez en vue squelette pour voir le champ du fichier qui la remplit."
zones_title = "Les zones"
zones_text = "Ce que chaque zone indique en partie, et la règle d'affichage qui va avec."
file_title = "Le fichier de la carte"
file_text = "Chaque carte est un fichier TOML dans cards/, versionné dans Git. Les numéros renvoient aux zones de la carte."
file_notes = [
  "Champs obligatoires: name et type.",
  "Valeurs par défaut: skin = \"light\", foil = \"basic\", shape = \"solid\", size = \"normal\", coûts à 0.",
  "Une valeur par défaut n'est pas écrite dans le fichier.",
]
looks_title = "Skin, finition et contour"
looks_text = "Trois réglages changent l'allure de toute la carte, sans rien changer à son effet en jeu. Ils se combinent librement, et sont tous présentés dans la partie Concepts plus bas."

[[anatomy.zones]]
key = "name"
title = "Nom"
field = "name"
text = "Le nom affiché en haut de la carte."
rule_label = "Affichage"
rule = "la police rétrécit pour les noms longs (trois tailles)."

[[anatomy.zones]]
key = "type"
title = "Type"
field = "type"
text = "La famille de la carte. Elle décide quand et comment la carte se joue."
rule_label = "Affichage"
rule = "donne sa couleur au badge, au contour et au bloc illustration."

[[anatomy.zones]]
key = "stroke"
title = "Contour"
field = "type + shape"
text = "Le trait autour de la carte, toujours de la couleur du type: on reconnaît la famille d'une carte d'un coup d'œil, même en miniature."
rule_label = "Affichage"
rule = "style réglé par shape, neuf contours."

[[anatomy.zones]]
key = "art"
title = "Illustration"
field = "art"
text = "L'image de la carte, rangée dans cards/art/."
rule_label = "Optionnelle"
rule = "sans image, le bloc prend la couleur du type et affiche son icône."

[[anatomy.zones]]
key = "description"
title = "Description"
field = "description"
text = "Ce que la carte représente dans le monde réel, en une ou deux phrases."
rule_label = "En jeu"
rule = "aucun effet, c'est du contexte."

[[anatomy.zones]]
key = "effect"
title = "Effect"
field = "effect"
text = "Ce que fait la carte une fois jouée, une ligne par effet."
rule_label = "Pour l'instant"
rule = "texte libre, il sera structuré pour le moteur de duel."

[[anatomy.zones]]
key = "deploy"
title = "Deploy Cost"
field = "deploy_cost"
text = "Les points de déploiement à dépenser pendant le Sprint pour poser la carte."
rule_label = "Valeur"
rule = "nombre entier, 0 par défaut."

[[anatomy.zones]]
key = "daily"
title = "Daily Cost"
field = "daily_cost"
text = "Ce que la carte coûte en dollars chaque jour, tant qu'elle est en jeu."
rule_label = "Valeur"
rule = "nombre entier, en $, 0 par défaut."

[[anatomy.zones]]
key = "flavor"
title = "Texte d'ambiance"
field = "flavor_text"
text = "Une phrase d'humour ou de contexte, en bas de la carte."
rule_label = "Affichage"
rule = "une seule ligne, coupée si elle est trop longue."

[day]
title = "Le tour par tour devient jour par jour"
intro = "Dans ce jeu, la notion de tour par tour devient jour par jour (pour bien rester dans le RP). Vous démarrez la partie avec 10 cartes. Ensuite, chaque journée se découpe en 3 phases."

[[day.phases]]
name = "Sprint"
when = "9h30 · daily"
text = [
  "Vous arrivez au travail, petit café (vous piochez une carte), les salutations habituelles, puis 9h30: daily meeting ! On passe en revue les tâches du Kanban en ***to-do***, ***pending*** et ***done***. Dans cette phase, vous planifiez et dépensez des points de déploiement, qui seront utilisés dans la phase suivante.",
]

[[day.phases]]
name = "Deployment"
when = "7 h de travail"
text = [
  "Fin du daily, on passe aux choses sérieuses ! Vous avez 7 h (pas vraiment, encore une fois on reste dans le RP) pour effectuer les tâches planifiées pendant le Sprint: faire évoluer votre infrastructure, ajouter une application Platform, faire évoluer une application Métier, créer de nouvelles ressources…",
  "Comme dans la vraie vie, vous ne pourrez pas tout faire en un jour: vous êtes limité par les points de déploiement dépensés pendant le Sprint.",
]

[[day.phases]]
name = "End of the day"
when = "fin de journée"
text = [
  "Que vos déploiements se soient bien passés ou non, il est temps d'implorer le saint patron des DevOps et de mettre des bâtons dans les roues de l'équipe d'en face ! Dans cette phase, vous pouvez jouer vos cartes INCIDENT, qui se répercutent dans le Kanban de votre adversaire.",
]

[day.points]
title = "Comment obtenir des points de déploiement"
items = [
  "Chaque semaine, +1 point de déploiement",
  "En recrutant de nouveaux collègues",
  "En faisant évoluer vos collègues grâce aux certifications",
]

[lifecycle]
title = "Une application, ça s'entretient"
text = "Pour qu'une application Métier vous rapporte des revenus, vous devrez l'entretenir ! Vous pourrez créer de nouvelles features qui vous rapporteront des points de KPI."
features = ["fix", "patch", "minor", "major"]
kpis = [
  "Stabilité",
  "Trafic",
  "Taux de réponse",
  "Taux de disponibilité",
  "Taux de conversion",
  "SLA",
  "Taux de clic",
  "Temps de réponse moyen",
]

[rarity]
title = "Les finitions"
text = "La finition indique la rareté d'une carte. Survolez une carte pour voir le reflet bouger."

# Partie « Concepts » : ce qui change l'allure d'une carte sans changer son effet en jeu.
# La finition reprend le texte de [rarity] ci-dessus.
[concepts]
title = "Anatomie d'une carte"
text = "Trois réglages changent l'allure d'une carte sans rien changer à son effet en jeu: la skin, la finition et le contour. Ils se combinent librement, une carte peut être Dark, Gold et Néon à la fois."

[concepts.skin]
title = "Les skins"
text = "La skin règle le fond de la carte, la couleur de ses blocs et de ses textes. Les skins classiques sont fixes, les skins animées ajoutent un effet en mouvement."

# Une bande par groupe. `key` choisit le rendu (light, dark, terminal, dracula, solarized, nord,
# blueprint, synthwave, glass, kraft, crt, ascii, matrix, glitch, circuit, monitoring, drive,
# aurora) ; `text` s'affiche sous la carte dans la vue zoomée.

[[concepts.skin.classic]]
key = "light"
title = "Light"
text = "La skin par défaut: fond clair, blocs blancs et texte ardoise."

[[concepts.skin.classic]]
key = "dark"
title = "Dark"
text = "Fond sombre, blocs bleu nuit et texte clair."

[[concepts.skin.classic]]
key = "terminal"
title = "Terminal"
text = "Noir profond et vert phosphore, avec de fines lignes de balayage comme un vieil écran."

[[concepts.skin.classic]]
key = "dracula"
title = "Dracula"
text = "Le thème d'éditeur bien connu: gris violacé, rose, violet et cyan."

[[concepts.skin.classic]]
key = "solarized"
title = "Solarized Light"
text = "Fond crème chaud et texte ardoise, avec un bloc de code en Solarized Dark."

[[concepts.skin.classic]]
key = "nord"
title = "Nord"
text = "Gris bleutés froids et accents givrés, calme et lisible."

[[concepts.skin.classic]]
key = "blueprint"
title = "Blueprint"
text = "Plan d'architecte: fond bleu quadrillé, blocs transparents à bords pointillés, texte blanc."

[[concepts.skin.classic]]
key = "synthwave"
title = "Synthwave"
text = "Dégradé violet nuit, rose et cyan néon, ambiance années 80."

[[concepts.skin.classic]]
key = "glass"
title = "Verre"
text = "Fond sombre teinté par la couleur du type, blocs en verre dépoli translucides."

[[concepts.skin.classic]]
key = "kraft"
title = "Kraft"
text = "Carton kraft et papier, avec un bloc de code sombre. Côté jeu de plateau."

[[concepts.skin.animated]]
key = "crt"
title = "Terminal CRT"
text = "Écran cathodique inspiré des terminaux de Fallout. Tout passe au vert phosphore, illustration comprise. Police pixel pour les titres, texte qui luit, lignes de balayage qui défilent, bande lumineuse qui descend, léger scintillement, coins assombris comme un écran bombé, et un curseur qui clignote après le texte d'ambiance. Seul le contour garde la couleur du type."

[[concepts.skin.animated]]
key = "ascii"
title = "ASCII"
text = "Toute la carte en caractères. L'illustration est convertie en art ASCII (les cartes sans image affichent le sigle du type), avec des cadres en tirets et des crochets autour des valeurs. Des caractères changent au hasard en continu, et le nom se brouille puis se recompose au survol."

[[concepts.skin.animated]]
key = "matrix"
title = "Matrix"
text = "Pluie de caractères verts qui tombe derrière des blocs sombres translucides, à une vitesse différente par colonne."

[[concepts.skin.animated]]
key = "glitch"
title = "Glitch"
text = "Fond noir, magenta et cyan. Le nom et l'illustration se décalent en couleurs séparées par à-coups, avec une bande de parasites qui traverse la carte."

[[concepts.skin.animated]]
key = "circuit"
title = "Circuit"
text = "Pistes de circuit imprimé dans la couleur du type, parcourues par des impulsions lumineuses."

[[concepts.skin.animated]]
key = "monitoring"
title = "Monitoring"
text = "Fond de dashboard façon Grafana, avec une grille, trois courbes qui défilent, et une LED d'état qui pulse dans le bloc du nom (rouge pour un Incident)."

[[concepts.skin.animated]]
key = "drive"
title = "Synthwave Drive"
text = "Soleil rayé et sol quadrillé en perspective qui défile vers l'avant, derrière des blocs translucides."

[[concepts.skin.animated]]
key = "aurora"
title = "Aurore"
text = "Trois nappes de couleur floues, dont une de la couleur du type, qui dérivent lentement derrière des blocs en verre."

[concepts.shape]
title = "Les contours"
text = "Le contour reprend toujours la couleur du type de la carte, seul son style change."

# Description de chaque contour, affichée sous la carte dans la vue zoomée (`key` = valeur de `shape`).

[[concepts.shape.items]]
key = "solid"
text = "Trait plein de 4 px, comme le calque cardTypeStroke du Figma. C'est le contour par défaut."

[[concepts.shape.items]]
key = "neon"
text = "Trait fin de 2 px avec un halo lumineux de la couleur du type, à l'intérieur et à l'extérieur."

[[concepts.shape.items]]
key = "gradient"
text = "Trait de 3 px qui passe de la couleur du type à une version éclaircie, en diagonale."

[[concepts.shape.items]]
key = "sweep"
text = "Un trait fin, avec une lumière de la couleur du type qui fait le tour de la carte (6 s par tour)."

[[concepts.shape.items]]
key = "double"
text = "Deux traits fins, un plein, un plus transparent juste à l'intérieur. Style carte premium."

[[concepts.shape.items]]
key = "corners"
text = "Seuls les quatre coins sont marqués, reliés par un filet très fin. Style interface, HUD."

[[concepts.shape.items]]
key = "chamfer"
text = "Carte et trait aux coins biseautés au lieu d'arrondis. Style tech, terminal."

[[concepts.shape.items]]
key = "topbar"
text = "Filet fin tout autour, et une barre épaisse de la couleur du type en haut de la carte."

[[concepts.shape.items]]
key = "thin"
text = "Un simple filet fin de 1 px de la couleur du type. Avec le background Teinté, on retrouve l'ancien « fond teinté »."


# Texte de la page /regles/concepts (document « Carte DCB v2 » : pistes de design).
# Les cartes d'exemple sont tirées au hasard dans la collection à chaque affichage, comme sur
# la page des règles. Chaque section est reconnue par sa `key` : changer une clé change
# l'exemple affiché, une clé inconnue est signalée en haut de la page.

title = "Carte DCB v2"
intro = "Pistes de design pour la carte: idées de modernisation, dessinées avec des cartes de la collection tirées au hasard. Cliquez sur une carte pour la voir en grand."

# ---------------------------------------------------------------------------------------------
# Idées : artfill, badge, chips, overlay, notitle, comment, serial, term, refs, relief, all

[[parts]]
kind = "ideas"
eyebrow = "Autres idées"
title = "Moderniser le reste de la carte"
lead = "Une section par idée, toutes avec le contour plein pour ne comparer qu'une chose à la fois. La dernière combine tout. Les cartes portent la base envisagée pour la suite: bloc effect.yaml arrondi à 6 px, titre en Inter 600 et code en mono."

[[parts.sections]]
key = "artfill"
title = "1. Cartes sans illustration"
text = "Fond dans la couleur du type avec un motif de points et une grande icône du type, au lieu du cadre blanc et de l'icône grise. Déjà en place dans l'app."

[[parts.sections]]
key = "badge"
title = "2. Badge de type"
text = "Pastille de la couleur du type avec une icône, posée sur l'illustration. Le nom prend toute la largeur de son bloc. Les cinq types."

[[parts.sections]]
key = "chips"
title = "3. Coûts compacts"
text = "Deux chips avec une icône (fusée, pièce) au lieu des grandes cases pastel. Les 25 px gagnés vont au bloc effect.yaml."

[[parts.sections]]
key = "overlay"
title = "4. Nom sur l'illustration"
text = "Plus de bloc nom, le nom est écrit sur le bas de l'image, sur un dégradé sombre, et l'illustration grandit de 70 px. Le type passe en badge."

[[parts.sections]]
key = "notitle"
title = "5a. Description sans titre"
text = "Le titre Description disparaît, le texte commence en haut du bloc, ce qui donne une ligne de plus."

[[parts.sections]]
key = "comment"
title = "5b. Description en commentaire YAML"
text = "Le bloc Description disparaît, la description devient un commentaire en tête de effect.yaml, et le bloc gagne 70 px de haut."

[[parts.sections]]
key = "serial"
title = "6. Numéro de collection"
text = "Un numéro en bas à droite, comme sur un jeu de cartes à collectionner (ici l'ordre alphabétique des fichiers)."

[[parts.sections]]
key = "term"
title = "7. Texte d'ambiance façon terminal"
text = "Police mono, un $ de la couleur du type devant et un curseur qui clignote."

[[parts.sections]]
key = "refs"
title = "8. Cartes citées dans les effets"
text = "Le nom d'une autre carte du jeu cité dans un effet prend la couleur de son type et se souligne. Sur la fiche, il pourrait mener à cette carte."

[[parts.sections]]
key = "relief"
title = "9. Relief de la peau claire"
text = "Blocs blancs avec une ombre douce et une bordure plus légère, pour mieux les détacher du fond."

[[parts.sections]]
key = "all"
title = "Tout ensemble"
text = "Les idées 1, 2, 3, 4, 5b, 6, 7, 8 et 9 combinées."

name: Image

# Publie ghcr.io/mathod95/dcb à chaque push : main donne `latest`, la branche preview donne
# `preview` (relancée sur le serveur par Watchtower). Tags `sha-<commit>` dans les deux cas.
on:
  push:
    branches: [main, preview]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mathod95/dcb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' }}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DCB_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
